name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: claims_test
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U claims_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CLAIMS_TEST_ADMIN_URL: "Host=localhost;Port=5432;Username=claims_test;Password=${{ github.run_id }}-${{ github.run_attempt }};Database=postgres"
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Key: "CI-only-signing-key-for-claims-management-api-2026-secure"
      ConnectionStrings__ClaimsDatabase: "Server=localhost;Database=ClaimsManagementDb;User Id=sa;Password=CI_Password_123!;TrustServerCertificate=True"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore backend
        run: dotnet restore

      - name: Build backend
        run: dotnet build --configuration Release --no-restore

      - name: Test backend
        run: dotnet test --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      VITE_API_URL: http://localhost:5293

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Test frontend in Chromium
        run: npm run test:e2e

      - name: Build frontend
        run: npm run build
