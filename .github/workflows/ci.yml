name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Key: "CI-only-signing-key-for-claims-management-api-2026-secure"
      ConnectionStrings__ClaimsDatabase: "Server=localhost;Database=ClaimsManagementDb;User Id=sa;Password=CI_Password_123!;TrustServerCertificate=True"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build
