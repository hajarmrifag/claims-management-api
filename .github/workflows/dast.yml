name: DAST

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "41 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    name: OWASP ZAP baseline
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: claims
          POSTGRES_USER: claims
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claims -d claims"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build --tag claims-management:dast .

      - name: Start application
        run: >-
          docker run --detach --name claims-management-dast --network host
          --env ASPNETCORE_URLS=http://0.0.0.0:10000
          --env DATABASE_URL=postgresql://claims:ci-only-password@127.0.0.1:5432/claims
          --env Jwt__Key=DAST-only-signing-key-with-at-least-32-characters
          claims-management:dast

      - name: Wait for health endpoint
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:10000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs claims-management-dast
          exit 1

      - name: Run passive OWASP ZAP scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:10000
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-baseline-report
          cmd_options: -a

      - name: Preserve application logs
        if: always()
        run: docker logs claims-management-dast
