services:
  - type: web
    name: claims-management
    runtime: docker
    branch: main
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        # Supply the Neon Free PostgreSQL URL in Render's environment settings.
        sync: false
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: ClaimsManagementApi
      - key: Jwt__Audience
        value: ClaimsManagementClient
      - key: Storage__Provider
        value: Local
